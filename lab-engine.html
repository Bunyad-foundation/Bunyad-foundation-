<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ژمێرەری زیرەکی تاقیگەی بێرنۆلی - پلاتفۆرمی بونیاد</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0719;
            --card-bg: #16102b;
            --card-border: rgba(224, 36, 195, 0.35);
            --primary-grad: linear-gradient(135deg, #e024c3, #7e22ce);
            --pink-accent: #f472b6;
            --blue-accent: #38bdf8;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(224, 36, 195, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(126, 34, 206, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            padding: 20px 14px 60px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-card {
            background: linear-gradient(135deg, rgba(224, 36, 195, 0.2), rgba(126, 34, 206, 0.25));
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            text-align: right;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .header-card h1 {
            font-size: 1.35rem;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .header-card p {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .lab-form {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--blue-accent);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.82rem;
            color: var(--text-sub);
        }

        .input-group input {
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            direction: ltr;
            text-align: center;
        }

        .input-group input:focus {
            border-color: var(--pink-accent);
        }

        .tubes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .tube-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tube-item label {
            font-size: 0.72rem;
            color: var(--pink-accent);
            text-align: center;
            direction: ltr;
        }

        .tube-item input {
            padding: 6px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            text-align: center;
            direction: ltr;
        }

        .calc-btn {
            background: var(--primary-grad);
            border: none;
            border-radius: 14px;
            color: #fff;
            padding: 14px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            box-shadow: 0 6px 18px rgba(224, 36, 195, 0.3);
        }

        .calc-btn:active {
            transform: scale(0.98);
        }

        .results-box {
            display: none;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--pink-accent);
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
        }

        .results-box.show {
            display: block;
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.76rem;
            text-align: center;
            direction: ltr;
        }

        th, td {
            padding: 8px 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(224, 36, 195, 0.25);
            color: var(--pink-accent);
        }

        .back-link {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-card">
            <h1>کاکولەیشنی خودکاری تاقیگەی بێرنۆلی</h1>
            <p>تەنها ژمارەکان بنووسە؛ خێرایی، وزەکان و داتاشیتەکە ئامادە دەکرێن</p>
        </div>

        <div class="lab-form">
            <div class="form-title">
                <i class="fa-solid fa-water"></i> داتاکانی سەرەتا (Volume & Time)
            </div>
            
            <div class="input-row">
                <div class="input-group">
                    <label>قەبارەی ئاو Volume (cm³):</label>
                    <input type="number" id="b_vol" value="3000">
                </div>
                <div class="input-group">
                    <label>کات Time (چرکە):</label>
                    <input type="number" id="b_time" value="25">
                </div>
            </div>

            <div class="form-title" style="margin-top: 8px; font-size: 0.95rem; color: var(--pink-accent);">
                <i class="fa-solid fa-list-ol"></i> بەرزی ئاو لە ١١ بۆرییەکە بنووسە (h بە cm):
            </div>

            <div class="tubes-grid">
                <div class="tube-item"><label>h1 (cm)</label><input type="number" id="h1" value="28.0"></div>
                <div class="tube-item"><label>h2 (cm)</label><input type="number" id="h2" value="26.0"></div>
                <div class="tube-item"><label>h3 (cm)</label><input type="number" id="h3" value="23.5"></div>
                <div class="tube-item"><label>h4 (cm)</label><input type="number" id="h4" value="20.0"></div>
                <div class="tube-item"><label>h5 (cm)</label><input type="number" id="h5" value="16.0"></div>
                <div class="tube-item" style="border-color:var(--pink-accent);"><label style="color:#fff; font-weight:bold;">h6 (تەسک)</label><input type="number" id="h6" value="12.0"></div>
                <div class="tube-item"><label>h7 (cm)</label><input type="number" id="h7" value="15.8"></div>
                <div class="tube-item"><label>h8 (cm)</label><input type="number" id="h8" value="19.5"></div>
                <div class="tube-item"><label>h9 (cm)</label><input type="number" id="h9" value="23.0"></div>
                <div class="tube-item"><label>h10 (cm)</label><input type="number" id="h10" value="25.5"></div>
                <div class="tube-item"><label>h11 (cm)</label><input type="number" id="h11" value="27.0"></div>
            </div>

            <button class="calc-btn" onclick="runBernoulliSolver()">
                <i class="fa-solid fa-calculator"></i> حیسابکردن و دەرکردنی داتاشیت
            </button>

            <!-- ئەنجامەکان -->
            <div id="bernoulliResults" class="results-box">
                <h4 style="color:var(--pink-accent); margin-bottom:6px;">ئەنجامی تەواوی داتاشیتەکە:</h4>
                <div id="b_summary" style="font-size:0.85rem; line-height:1.6; margin-bottom:10px;"></div>
                
                <div class="table-responsive">
                    <table id="b_table">
                        <thead>
                            <tr>
                                <th>Section</th>
                                <th>Area (mm²)</th>
                                <th>v (cm/s)</th>
                                <th>v²/2g (cm)</th>
                                <th>h (cm)</th>
                                <th>Total Head (cm)</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <a href="resources.html" class="back-link">
            <i class="fa-solid fa-arrow-right"></i> گەڕانەوە بۆ سەرچاوەکان
        </a>

    </div>

    <script>
        function runBernoulliSolver() {
            const vol = parseFloat(document.getElementById('b_vol').value) || 0;
            const time = parseFloat(document.getElementById('b_time').value) || 1;
            
            if (vol <= 0 || time <= 0) {
                alert("تکایە قەبارە و کات بە ژمارەی دروست بنووسە!");
                return;
            }

            const Q = vol / time; // cm^3/s

            // ڕووبەری ١١ خاڵەکە لە مەنفێستی تاقیگە
            const areas = [102.56, 90.11, 77.66, 65.22, 52.77, 40.32, 52.77, 65.22, 77.66, 90.11, 102.56];
            const tbody = document.querySelector('#b_table tbody');
            tbody.innerHTML = '';

            let totalHeadSum = 0;

            for (let i = 1; i <= 11; i++) {
                const hVal = parseFloat(document.getElementById('h' + i).value) || 0;
                const areaMm2 = areas[i - 1];
                const areaCm2 = areaMm2 / 100; // mm² -> cm²
                
                const v = Q / areaCm2; // cm/s
                const hv = (v * v) / (2 * 981); // cm
                const totalHead = hVal + hv;
                totalHeadSum += totalHead;

                const row = `<tr>
                    <td><b>${i}</b></td>
                    <td>${areaMm2}</td>
                    <td>${v.toFixed(1)}</td>
                    <td>${hv.toFixed(2)}</td>
                    <td>${hVal.toFixed(1)}</td>
                    <td style="font-weight:bold; color:#38bdf8;">${totalHead.toFixed(2)}</td>
                </tr>`;
                tbody.innerHTML += row;
            }

            const avgTotalHead = (totalHeadSum / 11).toFixed(2);

            document.getElementById('b_summary').innerHTML = `
                • تەوژمی ئاو (Flow Rate - Q): <b>${Q.toFixed(2)} cm³/s</b><br>
                • تێکڕای وزەی گشتی (Average Total Head): <b style="color:#38bdf8;">${avgTotalHead} cm</b> (دەبێت سەرجەم خاڵەکان نزیک بن لەم ژمارەیە)
            `;

            document.getElementById('bernoulliResults').classList.add('show');
        }
    </script>
</body>
</html>
