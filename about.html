<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بونیاد فاوندەیشن | پەڕەی نوێ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #120b22;
      --purple-primary: #8a2be2;
      --pink-neon: #ff2a85;
      --pink-soft: #ff758c;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background: radial-gradient(circle at 15% 20%, #300c42 0%, #11051f 50%, #08020e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .blueprint-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 42, 133, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(138, 43, 226, 0.08) 1px, transparent 1px);
      background-size: 35px 35px;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 650px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    /* سلایدەری دوو وێنەکە لە سەرەوە */
    .slider-box {
      position: relative;
      width: 100%;
      height: 230px;
      margin-bottom: 25px;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.8s ease-in-out;
    }

    .slider-track img {
      min-width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #ffffff, #ffb3d9);
      -webkit-background-clip: text;
      -webkit-fill-color: transparent;
    }

    .content-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      font-size: 15px;
      line-height: 1.9;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 25px;
      text-align: justify;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 28px;
      background: linear-gradient(90deg, var(--pink-neon), var(--purple-primary));
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 10px 20px rgba(255, 42, 133, 0.35);
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(138, 43, 226, 0.5);
    }
  </style>
</head>
<body>

  <div class="blueprint-grid"></div>

  <div class="container">
    <div class="card">
      
      <!-- بەشی سلایدەری جووڵاوی دوو وێنەکە لە سەرەوە -->
      <div class="slider-box">
        <div id="newSliderTrack" class="slider-track">
          <img src="slide1.jpg" alt="وێنەی یەکەم">
          <img src="slide2.jpg" alt="وێنەی دووەم">
        </div>
      </div>

      <h1 class="page-title">پڕۆژەی بونیاد فاوندەیشن</h1>

      <div class="content-box">
        بەخێربێیت بۆ ئەم بەشە نوێیە. لێرەدا دەتوانیت سەرچاوەکان، زانیارییە تایبەتەکان، یان هەر بەشێکی گرنگی ئەندازیاری کە دەتەوێت زیادی بکەیت بۆ فێرخوازان و سەردانکەران.
      </div>

      <!-- دوگمەی گەڕانەوە بۆ لاپەڕەی سەرەکی -->
      <a href="index.html" class="btn-back">
        <i class="fa-solid fa-arrow-right"></i> گەڕانەوە بۆ ماڵەوە
      </a>

    </div>
  </div>

  <!-- سکریپتی جووڵەی وێنەکان (هەر ۳ چرکە جارێک دەگۆڕێت) -->
  <script>
    let currentStep = 0;
    setInterval(() => {
      const track = document.getElementById('newSliderTrack');
      if (track) {
        currentStep = currentStep === 0 ? 1 : 0;
        track.style.transform = `translateX(-${currentStep * 100}%)`;
      }
    }, 3000);
  </script>

</body>
</html>
